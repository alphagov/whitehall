name: Build image from PR

# Lets govuk-preview-app preview any branch of Whitehall itself, not just
# releases - ImageResolver looks up ghcr.io/alphagov/govuk/whitehall tagged
# with a branch's own HEAD commit SHA, and waits for it to appear.
# github.event.pull_request.head.sha is that same SHA (the PR branch's real
# tip, not GitHub's synthetic merge commit).
#
# (Whitehall's own *dependencies* - publishing-api, frontend,
# draft-frontend - are always built from main regardless, so this is only
# about previewing Whitehall's own branch, not about its dependency tree.)
on:
  pull_request:

concurrency:
  group: build-image-from-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-publish-image:
    name: Build and publish image
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@main
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
